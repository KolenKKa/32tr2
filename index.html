<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web &amp; bot developer: portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-label="3D scene: floating islands, each island is a project"></canvas>

<header class="intro">
  <h1>Web &amp; bot developer</h1>
  <p class="lead">Full-stack developer. I build websites and Telegram bots with Python and JavaScript.</p>
</header>
<p class="hint">Drag to fly around. Scroll to zoom. Click an island to open a project.</p>

<nav id="islands" aria-label="Projects"></nav>
<div id="tip" role="tooltip"></div>

<aside id="panel" aria-hidden="true" aria-labelledby="p-title">
  <button id="close" aria-label="Close">×</button>
  <p class="kind" id="p-kind"></p>
  <h2 id="p-title"></h2>
  <p class="status" id="p-status" hidden></p>
  <p class="desc" id="p-desc"></p>
  <ul class="stack" id="p-stack"></ul>
  <p class="action" id="p-action"></p>
  <a class="link" id="p-link" target="_blank" rel="noopener" hidden></a>
  <div class="pager">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
